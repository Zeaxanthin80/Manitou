<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 107 1025 380"
     width="1025" height="380" role="img" aria-label="ImprimaPress">
  <title>ImprimaPress</title>
  <!--
    The store wordmark: IMPRIMA over PRESS, tracked to a common measure and
    split by a rule, which is the same heading-then-rule device the printed
    plates use.

    Outlines, not live text. The header renders this through an <img>, which
    cannot reach a webfont, and the whole point of a mark over a styled string
    is that it cannot silently fall back to another typeface. Cut from Archivo
    Black at -15 tracking on the top line and +74.75 on the bottom, which is
    what squares the two words to one measure. Regenerating it means repeating
    that, not retyping it.

    The fill is design-tokens.json `text` (#1C1917), baked in because an <img>
    cannot inherit currentColor. It is the one place a token value is duplicated
    outside the token file: change the palette and this file is redrawn.

    (No double hyphens in here. XML forbids them inside a comment, and the file
    fails to parse as a broken image rather than as an error you can read.)
  -->
