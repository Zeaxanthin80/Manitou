    The store wordmark: IMPRIMA over PRESS in two inks, generated with Recraft
    (recraftv4_1_vector, 2026-09-05) and then made exact. The fills were snapped
    to design-tokens.json: ink #1C1917 and accent #DB1B45, because an AI hits the
    neighbourhood of a colour and the header sits beside token-coloured text.
    The viewBox is cropped to the ink; the C2PA metadata block was removed.

    Baked colours, because an <img> cannot inherit currentColor. Change the
    palette and this file is regenerated. Six candidates were rendered and read
    for spelling before this one was chosen; there are no double hyphens in this
    comment because XML forbids them and the failure is a broken image, not an
    error.
  -->

